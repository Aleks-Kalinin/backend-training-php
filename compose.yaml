# Local development services. PHP itself runs natively via Laravel Herd.
# Docker Compose reads variables from the project's .env file automatically.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-backend_training}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
